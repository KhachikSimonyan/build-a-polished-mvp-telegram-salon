services:
  - type: web
    name: maison-rose-salon-bot
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: maison-rose-postgres
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BASE_URL
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SYNC_ENABLED
        value: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SYNC_INTERVAL_SECONDS
        value: 60

databases:
  - name: maison-rose-postgres
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: salon_booking
    user: salon_booking_user
